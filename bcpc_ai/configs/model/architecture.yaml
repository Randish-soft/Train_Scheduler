model:
  type: route_predictor
  
  base_architecture:
    input_dim: 128
    hidden_dims: [256, 512, 256]
    output_dim: 3
    dropout_rate: 0.3
    activation: relu
    batch_norm: true
  
  route_predictor:
    station_features: 10
    terrain_features: 8
    hidden_dim: 256
    num_layers: 4
    sequence_length: 100
    bidirectional: true
    
  graph_model:
    node_features: 64
    edge_features: 32
    hidden_dim: 128
    num_gnn_layers: 3
    num_classes: 5
    aggregation: mean
    
  attention_model:
    input_dim: 128
    hidden_dim: 256
    num_heads: 8
    num_layers: 6
    output_dim: 3
    dropout: 0.1
    
  vae_model:
    input_dim: 128
    latent_dim: 32
    hidden_dims: [256, 128, 64]
    beta: 1.0
    
  nimby_analyzer:
    demographic_features: 15
    land_features: 12
    heritage_features: 8
    hidden_dim: 128
    solution_types: 5
    
  ensemble:
    enabled: false
    models:
      - route_predictor
      - graph_model
    voting: soft
    weights: [0.6, 0.4]